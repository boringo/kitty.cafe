<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claire | kitty.cafe</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
      color: #2b1e20;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Custom background gradient with soft ambient glows */
      background:
        radial-gradient(circle at 20% 25%, #ffd4c4 0%, transparent 45%),
        radial-gradient(circle at 80% 30%, #e2d2ff 0%, transparent 45%),
        radial-gradient(circle at 50% 85%, #ffe6be 0%, transparent 50%),
        #fbf6f4;
      background-attachment: fixed;
      padding: 1.25rem;
    }

    /* Apple Liquid Glass Card */
    .profile-card {
      width: 100%;
      max-width: 440px;
      padding: 2.25rem 2rem;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.65) 0%,
        rgba(255, 255, 255, 0.35) 100%
      );
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow:
        0 24px 48px rgba(61, 44, 46, 0.09),
        inset 0 1.5px 1.5px rgba(255, 255, 255, 0.95),
        inset 1.5px 0 1.5px rgba(255, 255, 255, 0.6),
        inset 0 -2px 8px rgba(217, 119, 87, 0.08);
      border-radius: 30px;
      text-align: center;
    }

    /* Avatar & Online Dot */
    .avatar-container {
      position: relative;
      width: 90px;
      height: 90px;
      margin: 0 auto 1.25rem;
    }

    #dc-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      background: rgba(217, 119, 87, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
    }

    #dc-dot {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 3px solid #fff;
      background: #80848e;
    }

    /* Name & Bio */
    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .handle {
      color: #d97757;
      font-size: 0.92rem;
      font-weight: 600;
      margin-bottom: 0.8rem;
    }

    .bio {
      color: #6b5658;
      font-size: 0.96rem;
      line-height: 1.5;
      margin: 0 auto 1.75rem;
      max-width: 340px;
    }

    /* Live Discord Activity Banner */
    .discord-status-box {
      background: rgba(255, 255, 255, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.7);
      padding: 0.75rem 1rem;
      border-radius: 16px;
      margin-bottom: 1.5rem;
      font-size: 0.86rem;
      color: #5e4b4d;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .discord-status-box svg {
      width: 16px;
      height: 16px;
      fill: #5865F2;
      flex-shrink: 0;
    }

    /* Social Links List */
    .social-links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .social-btn {
      display: block;
      width: 100%;
      padding: 0.85rem 1.2rem;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 16px;
      color: #2b1e20;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.9), 0 4px 12px rgba(0, 0, 0, 0.03);
      transition: all 0.2s ease;
    }

    .social-btn:hover {
      background: rgba(255, 255, 255, 0.85);
      transform: translateY(-2px);
      box-shadow: inset 0 1px 1.5px rgba(255, 255, 255, 1), 0 6px 16px rgba(217, 119, 87, 0.12);
      color: #d97757;
    }

    footer {
      margin-top: 1.75rem;
      font-size: 0.8rem;
      color: #8c7375;
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <!-- Avatar & Live Status Dot -->
    <div class="avatar-container">
      <img id="dc-avatar" src="" alt="Avatar">
      <span id="dc-dot"></span>
    </div>

    <!-- Profile Info -->
    <h1 id="dc-display-name">Claire</h1>
    <div class="handle">@kitty.cafe</div>
    <p class="bio">Welcome to my cozy corner of the web. Catch me online or check out my links below.</p>

    <!-- Live Discord Activity Pill -->
    <div class="discord-status-box">
      <svg viewBox="0 0 127.14 96.36"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6,5.4,80.21h0A105.73,105.73,0,0,0,32.79,93.52,79.38,79.38,0,0,0,38.84,85a73,73,0,0,1-11.55-5.55c1-.72,1.98-1.48,2.94-2.26A74.47,74.47,0,0,0,96.9,77.1a73.27,73.27,0,0,1,3,5.55,105.47,105.47,0,0,0,27.39-13.3c7.58-23.77-1.71-47.67-19.54-61.25ZM42.45,65.69C36.18,65.69,31,60,31,53s5.18-12.72,11.45-12.72S53.9,46,53.86,53,48.71,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.18-12.72,11.45-12.72S96.15,46,96.1,53,90.95,65.69,84.69,65.69Z"/></svg>
      <span id="dc-activity">Loading status...</span>
    </div>

    <!-- Social Links Landing Page -->
    <div class="social-links">
      <a href="https://discord.com/users/YOUR_DISCORD_ID" target="_blank" class="social-btn">Discord Profile</a>
      <a href="https://github.com/boringo" target="_blank" class="social-btn">GitHub</a>
      <a href="mailto:hello@kitty.cafe" class="social-btn">Email Me</a>
    </div>

    <footer>
      © 2026 kitty.cafe
    </footer>
  </div>

  <script>
    const DISCORD_ID = "YOUR_DISCORD_ID"; // Replace with your numeric Discord User ID

    const statusColors = {
      online: "#23a55a",
      idle: "#f0b232",
      dnd: "#f23f43",
      offline: "#80848e"
    };

    async function loadDiscord() {
      try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
        const { data } = await res.json();
        const user = data.discord_user;

        // Set Avatar & Name
        const ext = user.avatar.startsWith("a_") ? "gif" : "png";
        document.getElementById("dc-avatar").src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${ext}?size=128`;
        document.getElementById("dc-display-name").textContent = user.display_name || user.username;

        // Set Online Status Dot Color
        document.getElementById("dc-dot").style.background = statusColors[data.discord_status] || statusColors.offline;

        // Set Live Status Text (Spotify, Game, or Custom status)
        const activityEl = document.getElementById("dc-activity");
        if (data.listening_to_spotify) {
          activityEl.textContent = `Listening to ${data.spotify.song}`;
        } else if (data.activities.length > 0) {
          const game = data.activities.find(a => a.type === 0);
          const custom = data.activities.find(a => a.type === 4);
          activityEl.textContent = game ? `Playing ${game.name}` : (custom?.state || data.discord_status);
        } else {
          activityEl.textContent = data.discord_status.charAt(0).toUpperCase() + data.discord_status.slice(1);
        }
      } catch {
        document.getElementById("dc-activity").textContent = "Status offline";
      }
    }

    loadDiscord();
  </script>
</body>
</html>
