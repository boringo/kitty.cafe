<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kitty.cafe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Hide default cursor on desktop devices with a mouse */
    @media (hover: hover) and (pointer: fine) {
      *, *::before, *::after {
        cursor: none !important;
      }
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f0f11 url('./bg.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Fullscreen osu! Cursor Canvas */
    #osu-cursor-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    /* Apple Liquid Glass Card */
    .glass-card {
      width: 100%;
      max-width: 440px;
      background: rgba(18, 18, 22, 0.65);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: transform 0.3s ease;
    }

    .glass-card:hover {
      transform: translateY(-4px);
    }

    /* Discord Banner Header */
    .discord-banner {
      width: 100%;
      height: 130px;
      background-color: #2b2d31;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    /* Profile Content Area */
    .profile-body {
      padding: 0 24px 24px 24px;
      position: relative;
    }

    /* Avatar & Decoration Wrapper */
    .avatar-container {
      position: relative;
      width: 88px;
      height: 88px;
      margin-top: -46px;
      margin-bottom: 14px;
    }

    .user-avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 4px solid rgba(18, 18, 22, 0.85);
      object-fit: cover;
      background-color: #1e1f22;
    }

    .avatar-decoration {
      position: absolute;
      top: -16px;
      left: -16px;
      width: 120px;
      height: 120px;
      pointer-events: none;
      z-index: 5;
    }

    /* Status Indicator Dot */
    .status-dot {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 3px solid rgba(18, 18, 22, 0.9);
      z-index: 6;
      background-color: #80848e;
    }

    .status-online { background-color: #23a55a; }
    .status-idle { background-color: #f0b232; }
    .status-dnd { background-color: #f23f43; }
    .status-offline { background-color: #80848e; }

    /* Header Row */
    .header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: nowrap;
    }

    .user-info {
      flex: 0 0 auto;
      min-width: 0;
    }

    .display-name {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }

    .username {
      font-size: 14px;
      color: #9ca3af;
      margin-top: 2px;
    }

    /* Stretches from username to right edge, clamped to 2 lines by default */
    .activity-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 11px;
      line-height: 1.35;
      color: #d1d5db;
      flex: 1;
      min-width: 0;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .activity-box:hover,
    .activity-box:focus {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.16);
      outline: none;
    }

    .activity-title {
      font-weight: 600;
      color: #e5e7eb;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .activity-details {
      display: -webkit-box;
      -webkit-line-clamp: 1; /* Title + 1 detail line = 2 lines total */
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: break-word;
    }

    /* Expands fully on hover / tap */
    .activity-box:hover .activity-details,
    .activity-box:focus .activity-details {
      -webkit-line-clamp: unset;
      overflow: visible;
    }

    /* Social Links */
    .links-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .social-link:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <!-- osu! Cursor Canvas -->
  <canvas id="osu-cursor-canvas"></canvas>

  <div class="glass-card">
    <!-- Discord Banner -->
    <div id="discord-banner" class="discord-banner"></div>

    <div class="profile-body">
      <!-- Avatar, Decoration & Status Dot -->
      <div class="avatar-container">
        <img id="discord-avatar" class="user-avatar" src="" alt="Avatar">
        <img id="discord-decoration" class="avatar-decoration" style="display: none;" alt="">
        <div id="status-dot" class="status-dot status-offline"></div>
      </div>

      <!-- Names & Stretched Status Box -->
      <div class="header-row">
        <div class="user-info">
          <div id="display-name" class="display-name">loading...</div>
          <div id="username" class="username">@...</div>
        </div>

        <!-- Activity / Status Box -->
        <div id="activity-box" class="activity-box" tabindex="0" style="display: none;">
          <div id="activity-title" class="activity-title"></div>
          <div id="activity-details" class="activity-details"></div>
        </div>
      </div>

      <!-- Social Links -->
      <div class="links-container">
        <a href="https://discord.com/users/1226611648413040821" target="_blank" class="social-link">
          Discord Profile
        </a>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================
       1. DISCORD LANYARD PROFILE LOGIC
       ========================================== */
    const DISCORD_ID = '1226611648413040821';

    async function fetchDiscordData() {
      try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
        const json = await res.json();

        if (json.success) {
          const { discord_user, discord_status, activities, kv } = json.data;

          // Banner
          const bannerEl = document.getElementById('discord-banner');
          if (kv && kv.banner) {
            bannerEl.style.backgroundImage = `url('${kv.banner}')`;
          }

          // Avatar
          const avatarImg = document.getElementById('discord-avatar');
          const ext = discord_user.avatar.startsWith('a_') ? 'gif' : 'png';
          avatarImg.src = `https://cdn.discordapp.com/avatars/${discord_user.id}/${discord_user.avatar}.${ext}?size=256`;

          // Avatar Decoration
          const decoImg = document.getElementById('discord-decoration');
          if (discord_user.avatar_decoration_data && discord_user.avatar_decoration_data.asset) {
            decoImg.src = `https://cdn.discordapp.com/avatar-decoration-presets/${discord_user.avatar_decoration_data.asset}.png`;
            decoImg.style.display = 'block';
          } else {
            decoImg.style.display = 'none';
          }

          // Names & Handle
          document.getElementById('display-name').textContent = discord_user.display_name || discord_user.username;
          document.getElementById('username').textContent = `@${discord_user.username}`;

          // Status Dot
          const statusDot = document.getElementById('status-dot');
          statusDot.className = `status-dot status-${discord_status}`;

          // Activities / Custom Status
          const activityBox = document.getElementById('activity-box');
          const activityTitle = document.getElementById('activity-title');
          const activityDetails = document.getElementById('activity-details');

          const customStatus = activities.find(a => a.type === 4);
          const playingActivity = activities.find(a => a.type === 0);

          if (playingActivity) {
            activityBox.style.display = 'block';
            activityTitle.textContent = playingActivity.name;
            activityDetails.textContent = playingActivity.details || playingActivity.state || 'Playing';
          } else if (customStatus && customStatus.state) {
            activityBox.style.display = 'block';
            activityTitle.textContent = 'Status';
            activityDetails.textContent = customStatus.state;
          } else {
            activityBox.style.display = 'none';
          }
        }
      } catch (err) {
        console.error('Failed to load Lanyard data:', err);
      }
    }

    fetchDiscordData();
    setInterval(fetchDiscordData, 10000);

    /* ==========================================
       2. CUSTOM CURSOR & GLOWING TRAIL LOGIC
       ========================================== */
    const canvas = document.getElementById('osu-cursor-canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;

    if (!isTouchDevice) {
      let mouse = { x: -100, y: -100 };
      let trail = [];
      let isMouseDown = false;
      let cursorScale = 1;

      // Load custom cursor image (cursor.png)
      const cursorImg = new Image();
      cursorImg.src = 'cursor.png';
      let imgLoaded = false;
      cursorImg.onload = () => { imgLoaded = true; };

      const TRAIL_COLOR = '255, 165, 210'; // Soft pink RGB trail
      const MAX_TRAIL = 26;

      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        trail.push({ x: mouse.x, y: mouse.y, alpha: 0.75 });
        if (trail.length > MAX_TRAIL) {
          trail.shift();
        }
      });

      window.addEventListener('mousedown', () => { isMouseDown = true; });
      window.addEventListener('mouseup', () => { isMouseDown = false; });

      function animateCursor() {
        ctx.clearRect(0, 0, width, height);

        // Smooth scale pulse on click
        const targetScale = isMouseDown ? 1.25 : 1;
        cursorScale += (targetScale - cursorScale) * 0.25;

        // Draw smooth glowing trail
        for (let i = 0; i < trail.length; i++) {
          const point = trail[i];
          const progress = i / trail.length;
          const radius = 12 * progress * cursorScale;

          ctx.beginPath();
          ctx.arc(point.x, point.y, Math.max(radius, 1), 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${TRAIL_COLOR}, ${point.alpha * progress * 0.55})`;
          ctx.fill();

          point.alpha *= 0.94;
        }

        trail = trail.filter(p => p.alpha > 0.03);

        // Draw custom cursor image (cursor.png) or fallback circle if loading
        if (mouse.x > 0 && mouse.y > 0) {
          ctx.save();
          if (imgLoaded) {
            const size = 48 * cursorScale; // Adjust display size of cursor.png here
            ctx.drawImage(cursorImg, mouse.x - size / 2, mouse.y - size / 2, size, size);
          } else {
            // Fallback circle if cursor.png is still loading
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 14 * cursorScale, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
          }
          ctx.restore();
        }

        requestAnimationFrame(animateCursor);
      }

      animateCursor();
    }
  </script>
</body>
</html>
